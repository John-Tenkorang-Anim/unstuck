[project]
name = "unstuck"
version = "0.1.0"
description = "Unstuck API, workers, and scheduler. Product name lives in settings.PRODUCT_NAME."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["../tests"]
pythonpath = [".", "api"]

[tool.ruff]
line-length = 100
target-version = "py312"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main", "settings"]
packages = ["domain", "adapters", "routers", "services", "workers", "workers.core", "workers.ai", "workers.media", "scheduler"]

[tool.setuptools.package-dir]
"" = "api"
workers = "workers"
scheduler = "scheduler"

[tool.setuptools.package-data]
domain = ["templates/*.json"]
